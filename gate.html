<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>URL Gate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Touch ID required</h1>
    <p id="description">The following URL is protected by URL Gate. It opens after you verify with Touch ID.</p>
    <p id="target" class="url"></p>
    <button id="unlock" type="button" hidden>Open with Touch ID</button>
    <button id="register" type="button" hidden>Register Touch ID and open</button>
    <p id="status" role="status"></p>
  </main>
  <script type="module" src="gate.js"></script>
</body>
</html>
