name: tagpr

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: read

# Third-party actions are pinned to a commit SHA, not a mutable tag.
jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@047aec4b6c0ce166f52958b5a97f5a3d927fd65b # v1.22.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Only when a release was created, attach the zip for the Chrome Web Store to the GitHub Release.
      - name: Attach the store zip to the GitHub Release
        if: steps.tagpr.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tagpr.outputs.tag }}
        run: |
          zip_path="$(node scripts/package.mjs)"
          gh release upload "$TAG" "$zip_path" --clobber
