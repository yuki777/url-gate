<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>URL Gate の設定</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>URL Gate</h1>
    <p id="state"></p>
    <button id="register" type="button">Touch ID を登録する</button>
    <p id="status" role="status"></p>

    <h2>対象 URL</h2>
    <p>ここに書いた URL を開く前に、Touch ID を求めます。保存にも Touch ID が必要です。</p>

    <label for="lines">対象 URL（1 行に 1 つ）</label>
    <textarea id="lines" class="url" rows="16" spellcheck="false"
      placeholder="example.com/admin&#10;!example.com/admin/help"></textarea>

    <h3>URL の書き方</h3>
    <ul class="hint">
      <li><code>example.com/admin</code>: このページと、その先のページを開く前に、Touch ID を求めます。</li>
      <li><code>!example.com/admin/help</code>: 行頭に <code>!</code> を付けると例外で、Touch ID なしで開けます。</li>
      <li><code>*</code> は任意の文字列に一致します（<code>*.example.com</code>）。<code>#</code> で始まる行はコメントです。</li>
    </ul>
    <p class="hint">ほかの書き方は、<a href="https://github.com/yuki777/url-gate#対象-url-の設定" target="_blank" rel="noopener noreferrer">詳しい書き方</a>にあります。</p>

    <button id="save" type="button">Touch ID で保存する</button>
    <p id="settings-status" role="status"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
